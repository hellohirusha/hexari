name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: bash .github/scripts/test-deployment-eligibility.sh
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run test:multiplayer
      - run: npm run build
      - run: npm run build:forge

  deployment-eligibility:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check for a merged pull request at the current main commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-deployment-eligibility.sh

  deploy:
    needs: [verify, deployment-eligibility]
    if: needs.deployment-eligibility.outputs.eligible == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/cd.yml
    with:
      railway_project_id: ${{ vars.RAILWAY_PROJECT_ID }}
      railway_environment_id: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      railway_service_id: ${{ vars.RAILWAY_SERVICE_ID }}
    secrets:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

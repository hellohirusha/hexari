name: Deploy to Vercel

on:
  workflow_call:
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hexari.hirusha.space
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out the commit verified by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@66.2.0
      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the current default-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          current_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
          if [ "$current_commit" != "$CI_COMMIT" ]; then
            echo "Skipping deployment: the default branch has moved past the CI commit."
            exit 0
          fi
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

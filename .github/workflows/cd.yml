name: Deploy production

on:
  workflow_call:
    inputs:
      railway_project_id:
        type: string
        required: false
      railway_environment_id:
        type: string
        required: false
      railway_service_id:
        type: string
        required: false
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      RAILWAY_API_TOKEN:
        required: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hexari.hirusha.space
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out the commit verified by CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@66.2.0
      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the current default-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: main
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          current_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
          if [ "$current_commit" != "$CI_COMMIT" ]; then
            echo "Deployment stopped: main has moved past the CI commit."
            exit 1
          fi
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  railway:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: railway-production
      cancel-in-progress: false
    environment:
      name: forge-multiplayer / production
      url: https://railway-forge.hirusha.space/health
    steps:
      - name: Check out the commit verified by CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.1.0
      - name: Deploy the current default-branch commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: main
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ inputs.railway_project_id }}
          RAILWAY_ENVIRONMENT_ID: ${{ inputs.railway_environment_id }}
          RAILWAY_SERVICE_ID: ${{ inputs.railway_service_id }}
        run: |
          current_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
          if [ "$current_commit" != "$CI_COMMIT" ]; then
            echo "Deployment stopped: main has moved past the CI commit."
            exit 1
          fi
          if [ -z "$RAILWAY_API_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_ENVIRONMENT_ID" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "Set RAILWAY_API_TOKEN and the Railway project, environment, and service IDs in GitHub."
            exit 1
          fi
          deployment="$(railway up --detach --json --service "$RAILWAY_SERVICE_ID" --message "Deploy $CI_COMMIT")"
          deployment_id="$(printf '%s\n' "$deployment" | jq -er '.deploymentId | select(type == "string" and length > 0)')"
          echo "Waiting for Railway deployment $deployment_id."
          for attempt in $(seq 1 90); do
            status="$(railway deployment list --json --service "$RAILWAY_SERVICE_ID" --limit 100 | jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status')"
            case "$status" in
              SUCCESS) echo "Railway deployment succeeded."; exit 0 ;;
              FAILED|CRASHED|REMOVED|SKIPPED) echo "Railway deployment ended with status $status."; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Railway deployment $deployment_id."
          exit 1
